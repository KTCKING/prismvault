name: Build macOS DMG

# 触发方式：
#   1) 在 GitHub 仓库的 Actions 页面点 “Run workflow” 手动触发；
#   2) 推送 v* 形式的 tag（如 git tag v0.1.0 && git push origin v0.1.0），
#      会自动构建并把 dmg 上传到对应的 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：发布到指定 tag 的 Release（如 v0.1.0）。留空则只产出 Actions artifact。"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: dmg · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M 系列）
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-14
          # Intel（macos-13 已于 2025-12 退役，改用官方最后的 x86_64 镜像）
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dmg
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg out/
          ls -lh out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismVault-${{ matrix.arch }}-dmg
          path: out/*.dmg
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PrismVault $TAG" --generate-notes
          fi
          gh release upload "$TAG" out/*.dmg --clobber
