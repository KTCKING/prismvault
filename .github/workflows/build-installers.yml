name: Build Installers

# 触发方式：
#   1) 在 GitHub 仓库的 Actions 页面点 “Run workflow” 手动触发；
#   2) 推送 v* 形式的 tag（如 git tag v0.1.0 && git push origin v0.1.0），
#      会自动构建并把安装包上传到对应的 Release。
#
# 产物：
#   - macOS：aarch64 / x86_64 两个 dmg（分别在 macos-14 与 macos-15-intel 上原生构建）
#   - Windows：NSIS 安装器（exe）+ MSI
# 桌面安装包无法跨平台交叉编译，所以每种平台必须在自己的 runner 上构建。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：发布到指定 tag 的 Release（如 v0.1.0）。留空则只产出 Actions artifact。"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: dmg · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M 系列）
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-14
          # Intel（macos-13 已于 2025-12 退役，改用官方最后的 x86_64 镜像）
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 不直接跑 `tauri build --bundles dmg`：CI 上那步内嵌的 create-dmg 会因
      # AppleScript 无法遥控 Finder 报 -1712，或卡在 hdiutil detach。
      # make-dmg.sh 会先试原生打包（带清场重试），失败再用 hdiutil 兜底封包。
      - name: Build dmg
        run: bash scripts/make-dmg.sh ${{ matrix.target }} out

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismVault-${{ matrix.arch }}-dmg
          path: out/*.dmg
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PrismVault $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" out/*.dmg --clobber

  windows:
    name: exe + msi · x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # windows-latest 的默认 host 是 x86_64-pc-windows-msvc —— 与本地构建用的
      # GNU 工具链不同，但产出等价；仓库里没有 .cargo/config 强制工具链，
      # 所以直接跟默认走即可（MSVC 下 tauri-winres 用 SDK 自带的 rc.exe）。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/bundle/msi/*.msi out/
          ls -lh out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismVault-x64-windows
          path: out/*
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PrismVault $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" out/* --clobber
