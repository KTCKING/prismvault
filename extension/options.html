<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PrismVault 网页摘取 · 设置</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 28px 20px 60px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #131316; color: #f2f2f4;
      }
      .wrap { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
      .sub { font-size: 12px; color: #7d7d86; margin-bottom: 22px; }
      .card {
        background: #1c1c20; border: 1px solid #292930; border-radius: 12px;
        padding: 16px 18px; margin-bottom: 14px;
      }
      h2 { font-size: 12px; font-weight: 600; color: #a9a9b2; margin: 0 0 12px; letter-spacing: .04em; }
      label.row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 12px; }
      label.row:last-child { margin-bottom: 0; }
      label.row .txt { flex: 1; min-width: 0; }
      label.row small { display: block; color: #75757e; font-size: 11px; margin-top: 2px; line-height: 1.5; }
      input[type="number"], input[type="text"] {
        width: 128px; height: 30px; padding: 0 9px; border-radius: 7px;
        background: #26262c; border: 1px solid #33333b; color: #f2f2f4; font-size: 12.5px;
      }
      input[type="text"].wide { width: 220px; }
      input[type="checkbox"] { width: 15px; height: 15px; accent-color: #ffb066; }
      .actions { display: flex; gap: 9px; align-items: center; margin-top: 8px; }
      button {
        height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent;
        font-size: 12.5px; font-weight: 600; cursor: pointer;
      }
      .primary { background: linear-gradient(180deg, #fff, #d9d9de); color: #141416; }
      .ghost { background: #22222a; color: #d6d6dc; border-color: #33333b; }
      .state { font-size: 12px; margin-left: 4px; }
      .state.ok { color: #4ec97a; }
      .state.bad { color: #e5584a; }
      .hint { font-size: 11.5px; color: #75757e; line-height: 1.65; }
      code { background: #26262c; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>PrismVault 网页摘取</h1>
      <div class="sub">连接设置 · 采集规则</div>

      <div class="card">
        <h2>连接</h2>
        <label class="row">
          <span class="txt">端口<small>与 PrismVault「设置 → 浏览器扩展」里显示的一致，默认 41596</small></span>
          <input type="number" id="port" min="1024" max="65535" />
        </label>
        <label class="row">
          <span class="txt">访问令牌<small>在 PrismVault 设置面板里点「复制」拿到的 16 位字符串</small></span>
          <input type="text" id="token" class="wide" spellcheck="false" placeholder="粘贴令牌" />
        </label>
        <div class="actions">
          <button class="ghost" id="test">测试连接</button>
          <span class="state" id="testState"></span>
        </div>
      </div>

      <div class="card">
        <h2>存放位置</h2>
        <label class="row">
          <input type="checkbox" id="folderBySite" />
          <span class="txt">按站点自动建子文件夹<small>勾选后每张图会存到「库根 / example.com /」下，方便按来源归类</small></span>
        </label>
        <label class="row">
          <span class="txt">固定子文件夹<small>不勾上面那项时生效；留空则直接存在库根目录</small></span>
          <input type="text" id="folder" placeholder="例如：网页摘取" />
        </label>
      </div>

      <div class="card">
        <h2>采集</h2>
        <label class="row">
          <input type="checkbox" id="includeVideo" />
          <span class="txt">面板里包含视频<small>视频会以原文件保存，库里显示为可播放的卡片</small></span>
        </label>
        <label class="row">
          <input type="checkbox" id="hoverButton" />
          <span class="txt">悬停图片时显示采集按钮<small>图片左上角浮出小方块，点一下直接存</small></span>
        </label>
        <label class="row">
          <span class="txt">忽略小于此尺寸的图<small>像素，按长边算。用来滤掉图标、分隔线、追踪像素</small></span>
          <input type="number" id="minSize" min="0" max="4096" />
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="save">保存设置</button>
        <span class="state" id="saveState"></span>
      </div>

      <p class="hint">
        提示：令牌只存在这台电脑的浏览器里，不会上传。PrismVault 每次点「重新生成」都会换一个新的，
        换完记得回来更新一次。数据流向是 <code>浏览器 → 127.0.0.1 → PrismVault 当前图库</code>，
        不经过任何服务器。
      </p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
