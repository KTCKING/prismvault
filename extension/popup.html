<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #17171a;
        color: #f2f2f4;
      }
      .wrap { padding: 14px; }
      .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .logo { width: 18px; height: 18px; border-radius: 6px; background: linear-gradient(135deg, #fff, #b9b9bf); }
      .title { font-size: 13px; font-weight: 600; }
      .status {
        display: flex; align-items: center; gap: 7px; font-size: 12px;
        padding: 9px 10px; border-radius: 9px; background: #202024;
        border: 1px solid #2b2b31; margin-bottom: 10px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #8a8a93; flex: 0 0 auto; }
      .dot.ok { background: #4ec97a; box-shadow: 0 0 0 3px rgba(78, 201, 122, 0.16); }
      .dot.bad { background: #e5584a; box-shadow: 0 0 0 3px rgba(229, 88, 74, 0.16); }
      .status .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lib { font-size: 11px; color: #8b8b94; margin: -4px 0 10px; line-height: 1.5; word-break: break-all; }
      button {
        width: 100%; height: 34px; border-radius: 9px; border: 1px solid transparent;
        font-size: 12.5px; font-weight: 600; cursor: pointer; margin-bottom: 7px;
      }
      .primary { background: linear-gradient(180deg, #fff, #d9d9de); color: #141416; }
      .primary:disabled { opacity: 0.4; cursor: default; }
      .ghost { background: #202024; color: #d6d6dc; border-color: #2b2b31; }
      .ghost:hover { background: #26262c; }
      .tip { font-size: 11px; color: #75757e; line-height: 1.6; margin-top: 4px; }
      kbd {
        background: #26262c; border: 1px solid #33333a; border-radius: 4px;
        padding: 0 4px; font-size: 10px; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="logo"></div>
        <div class="title">PrismVault 网页摘取</div>
      </div>

      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="txt" id="status">正在连接 PrismVault…</span>
      </div>
      <div class="lib" id="lib"></div>

      <button class="primary" id="open" disabled>打开采集面板</button>
      <button class="ghost" id="settings">扩展设置</button>

      <div class="tip">
        任意网页按 <kbd>Alt</kbd> + <kbd>S</kbd> 也能打开面板；右键图片可直接保存。
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
