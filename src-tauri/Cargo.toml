[package]
name = "prismvault"
version = "0.5.0"
description = "High-performance image management desktop app"
authors = ["KTCKING"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prismvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "vtab", "array"] }
blake3 = "1"
tokio = { version = "1", features = ["full"] }
notify = { version = "6", features = ["macos_kqueue"] }
walkdir = "2"
image = "0.25"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
opener = "0.7"
rexif = "0.7"
rayon = "1"

# eaglepack 导入：只开 deflate。默认 features 会拉 bzip2 / zstd / aes（都是 C 依赖），
# 在 Windows GNU 工具链上要 cc/make，没必要。Eagle 只用 store 与 deflate 两种方式。
zip = { version = "2", default-features = false, features = ["deflate"] }

# Patch indexmap to force has_std on Windows GNU target (autocfg probe fails)
[patch.crates-io]
indexmap = { path = "../patches/indexmap-1.9.3" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
