[package]
name = "prismvault"
version = "0.1.0"
description = "High-performance image management desktop app"
authors = ["PrismVault"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prismvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "vtab", "array"] }
blake3 = "1"
tokio = { version = "1", features = ["full"] }
notify = { version = "6", features = ["macos_kqueue"] }
walkdir = "2"
image = "0.25"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
opener = "0.7"
rexif = "0.7"
rayon = "1"

# Patch indexmap to force has_std on Windows GNU target (autocfg probe fails)
[patch.crates-io]
indexmap = { path = "../patches/indexmap-1.9.3" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
